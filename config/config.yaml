# Quest3 Streamer Configuration
# All paths are relative to project root unless absolute

active_robot: openarm

paths:
  # Isaac Sim installation (absolute path)
  isaac_sim: "/home/saurabh/isaac_sim"

  # SSL certificates
  certs:
    cert: "certs/cert.pem"
    key: "certs/key.pem"

# Server configuration
server:
  host: "0.0.0.0"
  websocket_port: 9999
  https_port: 8000

# Local LAN configuration (used by run_lan_teleop.sh)
# Set robot_pc_ip to this workstation's LAN IP (e.g. 192.168.1.42).
# Leave empty to auto-detect (uses hostname -I | awk '{print $1}').
lan:
  robot_pc_ip: ""       # auto-detected if empty
  websocket_port: 9999  # must match server.websocket_port
  https_port: 8000      # must match server.https_port

# Remote transport / VPN tuning
transport:
  log_interval_s: 0.0
  # Pose prediction extrapolates the target by velocity * horizon to cancel the
  # residual group delay of the smoothing filter and the one-way transport age.
  # Bounded by the jump-safety clamp, so it cannot yank the arm. Tune horizon to
  # roughly match the measured one-way latency (watch left_browser_age_ms).
  enable_prediction: true
  prediction_horizon_ms: 40
  jitter_buffer_frames: 0
  forward_queue_size: 64
  forward_retry_interval_s: 2.0
  remote_receiver:
    host: "0.0.0.0"
    port: 9998

# Isaac Sim launcher defaults
isaac:
  headless: false
  width: 1920
  height: 1080
  window_width: 1920
  window_height: 1080
  warmup_updates: 30
  stage_stabilization_updates: 50
  world_stabilization_updates: 20
  post_reset_updates: 20
  hide_ui_panels: true
  hidden_windows:
    - "Stage"
    - "Layer"
    - "Render Settings"
    - "Content"
    - "Content Library"
    - "Console"
    - "Property"
    - "Properties"
    - "Semantics"
    - "Visual Scripting"
  # --- Control-loop pacing (ultra-low-latency) ---
  # The control loop (physics + IK) runs at up to target_control_rate_hz while
  # rendering is throttled to one render every render_every_n_steps. This
  # decouples control latency from the render frame time, which is the dominant
  # per-iteration cost. Works in windowed GUI mode (the LAN default) and
  # headless/WebRTC mode alike.
  #   target_control_rate_hz: max control+physics rate (Hz). The loop self-paces
  #     and falls back gracefully if a frame overruns.
  #   render_every_n_steps: render only every Nth physics step. Set to 1 to
  #     render every step (legacy behavior). Higher N = faster control loop,
  #     lower on-screen fps. N=2 is a good starting point for the windowed GUI.
  target_control_rate_hz: 60
  render_every_n_steps: 1

# Camera capture and ROS image publishing
cameras:
  enabled: true
  resolution: [640, 480]
  publish_interval_frames: 2
  queue_size: 10
  log_errors: true
  error_log_interval_s: 5.0

recording:
  enabled: false
  dataset_format: "v3.0"
  root: "datasets"
  repo_id: "local/quest3-openarm"
  task: "Teleoperate OpenArm to complete the task"
  fps: 30
  max_episodes: null
  verbose: false
  encoder_threads: 4
  image_writer_threads: 4
  auto_start_episode: false
  deferred_rendering: true
  cameras:
    resolution: [640, 480]
  buttons:
    switch_camera: "right_primary"
    reset_scene: "right_secondary"
    save_episode: "left_primary"
    start_episode: "left_secondary"

# Teleoperation safety configuration
teleop:
  calibration_samples: 30
  position_scale: [1.0, 1.0, 1.0]
  workspace_center: [0.3, 0.0, 0.3]
  smoothing:
    # Rate-invariant time-constant smoothing (preferred). tau_s is the
    # exponential time constant; alpha = exp(-dt/tau) each step, so the
    # smoothing *feel* stays constant even when the loop rate changes (e.g.
    # when physics is decoupled from rendering). ~0.10 s reproduces the old
    # alpha=0.9 feel at 60 Hz but stays stable at 120 Hz.
    # Leave commented to fall back to the legacy per-step position_alpha below.
    position_tau_s: 0.10
    orientation_tau_s: 0.10
    # Legacy per-step alpha (0..1). Used only when *_tau_s is unset.
    position_alpha: 0.9
    orientation_alpha: 0.9
  deadman_timeout_ms: 500
  hard_timeout_ms: 1000
  max_target_jump_m: 0.25
  max_target_velocity_mps: 0.8
  # How quickly motion re-engages after a stale/deadman recovery (0..1). Higher
  # = snappier re-engage. The main loop is now faster, so a quicker recovery is
  # safe and avoids the "sluggish after a hiccup" feel.
  stale_recovery_alpha: 0.5

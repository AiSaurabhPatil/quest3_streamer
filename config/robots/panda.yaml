robot_type: panda
usd: "environment.usd"
franka_prim_path: "/World/Franka"
franka_name: "franka"
ik_robot_name: "Franka"
ik_policy_name: "RMPflow"

arm:
  frame_name: "panda_hand"
  joints:
    - "panda_joint1"
    - "panda_joint2"
    - "panda_joint3"
    - "panda_joint4"
    - "panda_joint5"
    - "panda_joint6"
    - "panda_joint7"

grippers:
  open_position: 0.04
  closed_position: 0.0
  threshold: 0.3
  joints:
    - "panda_finger_joint1"
    - "panda_finger_joint2"

teleop:
  robot_home: [0.5, 0.0, 0.4]
  pos_scale: 1.0
  calibration_samples: 30
  workspace:
    x_min: 0.15
    x_max: 0.85
    y_min: -0.6
    y_max: 0.6
    z_min: 0.02
    z_max: 0.9

cameras:
  wrist:
    prim_path: "/World/Franka/panda_hand/gripper_camera"
    topic: "/camera/wrist/image_raw"

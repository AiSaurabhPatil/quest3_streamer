grippers:
  open_position: 0.044
  closed_position: 0.0
  speed: 0.003
  threshold: 0.5
  left_joints:
    - "left_joint7"
    - "left_joint8"
  right_joints:
    - "right_joint17"
    - "right_joint18"

ik:
  orientation_mode: "full_pose"
  position_tolerance: 0.015
  orientation_tolerance: 0.75
  orientation_fallback_to_position: true

teleop:

  deadman_timeout_ms: 250
  hard_timeout_ms: 1000
  max_target_jump_m: 0.25

recording:
  robot_type: acone
  joint_groups:
    left_arm:
      source: articulation
      joints:
        - "left_joint1"
        - "left_joint2"
        - "left_joint3"
        - "left_joint4"
        - "left_joint5"
        - "left_joint6"
    right_arm:
      source: articulation
      joints:
        - "right_joint11"
        - "right_joint12"
        - "right_joint13"
        - "right_joint14"
        - "right_joint15"
        - "right_joint16"
    left_gripper_scalar:
      source: adapter
      name: "left_gripper"
      value: "normalized_gripper"
      side: "left"
    right_gripper_scalar:
      source: adapter
      name: "right_gripper"
      value: "normalized_gripper"
      side: "right"
